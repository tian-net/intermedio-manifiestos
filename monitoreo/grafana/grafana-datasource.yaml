apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: monitoreo
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.monitoreo.svc.cluster.local:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provisioning
  namespace: monitoreo
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'elchino'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
